<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>404 — Page Not Found | Arnab Saha</title>
  <link rel="icon" href="/favicon.ico" type="image/x-icon" />
  <script type="module" src="/sub-page-app.js"></script>
</head>
<body>
  <!-- Page Loader -->
  <div class="page-loader" aria-hidden="true">
    <svg width="120" height="60" viewBox="0 0 120 60">
      <defs>
        <linearGradient id="gradient-brand" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" stop-color="#7c3aed" />
          <stop offset="100%" stop-color="#f97316" />
        </linearGradient>
      </defs>
      <text x="10" y="45">A$</text>
    </svg>
  </div>

  <nav class="navbar" role="navigation">
    <a href="/" class="navbar-brand">A$ <span aria-hidden="true">🔥</span></a>
    <div class="navbar-right">
      <button class="theme-toggle" aria-label="Toggle dark/light mode">
        <span class="icon-moon" aria-hidden="true">🌙</span>
        <span class="icon-sun" aria-hidden="true">☀️</span>
      </button>
    </div>
  </nav>

  <main style="min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding-top:80px;">
    <div>
      <img src="/images/404.jpg" alt="Lost on an island" style="max-width:500px;width:90%;margin:0 auto var(--space-8);border-radius:var(--radius-xl);" loading="eager" />
      <h1 style="font-size:var(--text-4xl);margin-bottom:var(--space-4);">
        <span class="text-gradient">Page Not Found</span>
      </h1>
      <p style="color:var(--text-muted);margin-bottom:var(--space-8);max-width:400px;margin-left:auto;margin-right:auto;">
        It looks like you're lost. The page you're looking for doesn't exist or has been moved.
      </p>
      <a href="/" class="btn btn-primary">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
        Take me home
      </a>
    </div>
  </main>
</body>
</html>
